name: Tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # A new push to the same branch supersedes the run in flight.
  group: tests-${{ github.ref }}
  cancel-in-progress: true

# Every step that pipes pytest into tee sets `shell: bash`, which is
# `bash -eo pipefail`. The default for `run:` is `bash -e` WITHOUT pipefail, so
# `pytest | tee` would report tee's exit code and the job would go green on a
# failing suite — the one failure mode CI exists to prevent.

jobs:
  # Both jobs run the same suite; the point is the difference between them.
  # Without a database 68 tests skip, and those 68 are the ones proving the H3
  # persistence claims — so a green `no-database` alone means little. Make
  # `Tests (Postgres)` the required check in branch protection.
  postgres:
    name: Tests (Postgres)
    runs-on: ubuntu-latest

    services:
      postgres:
        # Matches the version H3 was developed and verified against.
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: knowledge_keeper_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/knowledge_keeper_test
      # Not a real key. Every test stubs the LLM; this exists so settings
      # construction matches the production shape rather than falling back to "".
      ANTHROPIC_API_KEY: sk-ant-ci-not-a-real-key
      # Tokens are HMAC-signed with this. Unset, each process invents its own,
      # and the multi-worker token test fails intermittently — which is exactly
      # the production failure that test was written to catch.
      API_SECRET_KEY: ci-test-signing-key
      ENVIRONMENT: development

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches the Dockerfile's python:3.12-slim, so CI exercises the
          # interpreter production actually runs.
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Four tests in test_spa_route.py exercise the mounted SPA route, and
      # mounting only happens when frontend/dist exists. Without this they skip
      # in CI while passing on any machine that happens to have a build — which
      # is how the C2 traversal tests silently covered nothing until 5a200e7.
      # Mirrors the Dockerfile's frontend-build stage.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Run tests
        shell: bash
        # -rs lists every skip with its reason, which the next step checks.
        run: pytest -q -rs | tee result.txt

      - name: Nothing may skip in this job
        shell: bash
        # This job has a database AND a built frontend, so every test in the
        # suite can run — and therefore must. The strict form catches both ways
        # a green badge can cover nothing:
        #   * the service container was unreachable, so all 68 Postgres-backed
        #     tests skipped themselves and every H3 claim went untested;
        #   * a test is gated on something CI does not provide, which this repo
        #     has already shipped once (the C2 traversal tests, fixed in
        #     5a200e7, and the SPA route tests this workflow's first run found).
        # If you add a test that legitimately cannot run here, make it run here
        # rather than widening this check.
        run: |
          if grep -q "^SKIPPED" result.txt; then
            echo "::error::A test skipped in the job where everything should run"
            grep "^SKIPPED" result.txt
            exit 1
          fi
          echo "No skips: the whole suite ran."

  no-database:
    name: Tests (no database)
    runs-on: ubuntu-latest

    env:
      ANTHROPIC_API_KEY: sk-ant-ci-not-a-real-key
      API_SECRET_KEY: ci-test-signing-key
      ENVIRONMENT: development

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Four tests in test_spa_route.py exercise the mounted SPA route, and
      # mounting only happens when frontend/dist exists. Without this they skip
      # in CI while passing on any machine that happens to have a build — which
      # is how the C2 traversal tests silently covered nothing until 5a200e7.
      # Mirrors the Dockerfile's frontend-build stage.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Run tests
        shell: bash
        # The in-memory fallback must keep working: it is what local runs and
        # ENVIRONMENT=development use.
        run: pytest -q -rs | tee result.txt

      - name: Every skip must be explained by the missing database
        shell: bash
        # A skip for any other reason is a test quietly not running, which is
        # how a suite passes while covering less than it claims. This branch
        # already shipped that once: four traversal tests were gated on a
        # gitignored build artefact and silently skipped everywhere.
        run: |
          skips=$(grep -c "^SKIPPED" result.txt || true)
          named=$(grep "^SKIPPED" result.txt | grep -c "TEST_DATABASE_URL" || true)
          echo "skipped: $skips, explained by TEST_DATABASE_URL: $named"
          if [ "$skips" != "$named" ]; then
            echo "::error::A test skipped for a reason other than the missing database"
            grep "^SKIPPED" result.txt | grep -v "TEST_DATABASE_URL"
            exit 1
          fi
